<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <pattern id="dots" x1="0" y1="0" x2="20" y2="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#e60012" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#dots)"/>
  
  <!-- Persona 5 angled comic sash -->
  <polygon points="0,440 600,340 600,470 0,570" fill="#e60012" opacity="0.95"/>
  <polygon points="0,420 600,320 600,345 0,445" fill="#ffffff" opacity="0.9"/>
  
  <!-- Center circle frame -->
  <circle cx="300" cy="240" r="120" fill="#1e1e1e" stroke="#ffffff" stroke-width="5"/>
  
  <!-- Silhouette / Monogram Icon -->
  <circle cx="300" cy="195" r="48" fill="#ffffff"/>
  <path d="M210,325 C210,260 390,260 390,325 Z" fill="#ffffff"/>
  
  <!-- Badge Label -->
  <g transform="translate(300, 480)">
    <rect x="-240" y="-35" width="480" height="55" fill="#ffffff" stroke="#000000" stroke-width="4"/>
    <text x="0" y="4" text-anchor="middle" font-family="'Impact', Arial Black, sans-serif" font-size="32" fill="#000000" letter-spacing="2">HARSHIT AGARWAL</text>
    <rect x="-210" y="27" width="420" height="30" fill="#e60012"/>
    <text x="0" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold" font-size="15" fill="#ffffff" letter-spacing="1.5">INCUBATION MANAGER // CIE</text>
  </g>
</svg>

